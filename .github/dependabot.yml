version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - '@eslint/*'
          - 'eslint*'
          - 'prettier*'
          - 'vitest*'
          - '@vitest/*'
          - '@testing-library/*'
          - 'husky'
          - 'lint-staged'
      vite:
        patterns:
          - 'vite*'
          - '@vitejs/*'
          - '@tailwindcss/*'
          - 'tailwindcss'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
